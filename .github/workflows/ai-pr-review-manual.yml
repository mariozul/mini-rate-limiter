# AI PR Review — manual trigger for the org toolkit.
#
# Runs the toolkit review only when a /review comment is posted on a PR.
# Use when a repo should not spend review budget on every push; authors trigger
# reviews explicitly. All review behavior (policies, model, dimensions,
# telemetry) lives in astronautsid/astro-ai-toolkit and the consuming repo's
# REVIEW.md — this file is a thin trigger only.
#
# Org-level secrets consumed via `secrets: inherit` (set once by an org admin):
#   OCR_LLM_URL, OCR_LLM_AUTH_TOKEN, OLTP_AUTH_GITHUB (note the SRE-created name)
# Optional variable: OCR_REVIEW_MODEL (review-model override; absent → toolkit default gpt-5.6-luna)
name: AI PR Review (manual)

concurrency:
  group: ocr-${{ github.event.issue.number }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      github.event.comment.body == '/review'
    uses: astronautsid/astro-ai-toolkit/.github/workflows/reusable-pr-review.yml@v1
    secrets: inherit
