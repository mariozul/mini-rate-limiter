# AI PR Review — always-on-push trigger for the org toolkit.
#
# Runs the toolkit review on every PR open/update plus the /review comment.
# All review behavior (policies, model, dimensions, telemetry) lives in
# astronautsid/astro-ai-toolkit and the consuming repo's REVIEW.md — this file
# is a thin trigger only.
#
# Org-level secrets consumed via `secrets: inherit` (set once by an org admin):
#   OCR_LLM_URL, OCR_LLM_AUTH_TOKEN, (optional) OTLP_AUTH
# Optional variable: OCR_REVIEW_MODEL (review-model override; absent → toolkit default gpt-5.6-luna)
name: AI PR Review (on push)

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && github.event.comment.body == '/review'
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# pull_request (not pull_request_target): org repos are private, forks are
# unlikely, and the toolkit only reads the checked-out code — avoid the
# secret-exposure class of pull_request_target entirely.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && github.event.comment.body == '/review'
      )
    uses: astronautsid/astro-ai-toolkit/.github/workflows/reusable-pr-review.yml@v1
    secrets: inherit
