name: Template cleanup

# One-shot bootstrap for repos created from this template. Renames the
# module path, app name, sonar keys, mongo database, dev-stack credentials,
# and every other identity-bearing reference to match the new repo's name,
# commits the changes, and deletes itself so it never runs again.
#
# The job is guarded by `repository.name != 'astro-boilerplate'` so it
# never fires on the boilerplate itself — only on repos that were created
# via "Use this template" on GitHub.
#
# If the new repo's default branch is renamed away from `develop` before
# the first push, the push trigger won't fire; use the workflow_dispatch
# button in the Actions tab to run it manually.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    if: github.event.repository.name != 'astro-boilerplate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if already renamed
        id: precheck
        run: |
          if ! grep -q '^module github.com/astronautsid/astro-boilerplate' go.mod; then
            echo "go.mod no longer references astro-boilerplate; this workflow has already run on a previous push. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute new identity
        if: steps.precheck.outputs.skip != 'true'
        id: ident
        run: |
          NEW_MODULE="github.com/${{ github.repository }}"
          NEW_APP="${{ github.event.repository.name }}"
          # Mongo / Postgres identifiers disallow hyphens; normalise.
          NEW_DB="$(echo "$NEW_APP" | tr '-' '_')"
          echo "module=$NEW_MODULE" >> "$GITHUB_OUTPUT"
          echo "app=$NEW_APP" >> "$GITHUB_OUTPUT"
          echo "db=$NEW_DB" >> "$GITHUB_OUTPUT"
          echo "Renaming to module=$NEW_MODULE app=$NEW_APP db=$NEW_DB"

      - name: Apply renames
        if: steps.precheck.outputs.skip != 'true'
        run: |
          OLD_MODULE="github.com/astronautsid/astro-boilerplate"
          NEW_MODULE="${{ steps.ident.outputs.module }}"
          NEW_APP="${{ steps.ident.outputs.app }}"
          NEW_DB="${{ steps.ident.outputs.db }}"

          # Find all tracked text files, excluding the workflow itself
          # (gets deleted in a later step) and any binary/state dirs. The
          # sed order matters: module path FIRST (it contains the bare
          # word `astro-boilerplate`), then the underscore variant
          # (mongo/postgres identifiers), then the hyphenated bare word
          # (app name, sonar keys, log strings, doc strings).
          find . -type f \
               -not -path './.git/*' \
               -not -path './.github/workflows/template-cleanup.yml' \
               -exec sed -i "s|${OLD_MODULE}|${NEW_MODULE}|g" {} +

          find . -type f \
               -not -path './.git/*' \
               -not -path './.github/workflows/template-cleanup.yml' \
               -exec sed -i "s|astro_boilerplate|${NEW_DB}|g" {} +

          find . -type f \
               -not -path './.git/*' \
               -not -path './.github/workflows/template-cleanup.yml' \
               -exec sed -i "s|astro-boilerplate|${NEW_APP}|g" {} +

          # Strip the template-only block from the README. The sentinels
          # wrap content that only makes sense in the boilerplate (links
          # to this workflow file, "use this template" instructions);
          # after rename, the new repo doesn't need them.
          sed -i '/<!-- TEMPLATE-ONLY-START -->/,/<!-- TEMPLATE-ONLY-END -->/d' README.md

      - name: Delete this workflow so it never runs again
        if: steps.precheck.outputs.skip != 'true'
        run: git rm .github/workflows/template-cleanup.yml

      - name: Commit and push
        if: steps.precheck.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "chore: initialize from astro-boilerplate template

          Auto-renamed module path, app name, sonar keys, mongo/postgres
          database identifiers, and dev-stack credentials to match this
          repo's identity. Generated by the template-cleanup workflow,
          which has now removed itself."
          git push
