# SonarQube scanner config for mini-rate-limiter. Fork-and-rename the
# projectKey / projectName when you stand up a new service from this
# scaffold; the rest of the file is layout-driven and should not need
# changes unless you add new top-level directories.

sonar.projectKey=mini-rate-limiter
sonar.projectName=mini-rate-limiter
sonar.projectVersion=1.0

sonar.sources=.
sonar.sources.inclusions=**/**.go
sonar.inclusions=**/*.go

# Excluded from analysis + coverage. Rationale:
#   config/        — pure plumbing, no logic to analyse
#   cmd/           — composition root; wiring, not behavior
#   infrastructure — adapters around external systems; tested via integration
#   interface/     — gRPC + Pub/Sub handlers; thin transport layer
#   mocks/         — generated
#   proto/         — generated
#   scripts/       — shell tooling
#   domain/entity  — anemic value-types and aggregate scaffolding; coverage
#                    here is misleading because most behavior lives in
#                    application use cases
sonar.exclusions=**/config/**,**/cmd/**,**/infrastructure/**,**/interface/**,**/mocks/**,**/proto/**,**/scripts/**,**/domain/entity/**
sonar.tests=./
sonar.test.inclusions=**/*_test.go

sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=**/config/**,**/cmd/**,**/infrastructure/**,**/interface/**,**/mocks/**,**/proto/**,**/scripts/**,**/domain/entity/**
sonar.go.coverage.reportPaths=**.out
sonar.go.coverage.dtdVerification=false

# Quality gate: only block on critical and above. Informational, minor, and
# major issues surface in the UI but do not fail the pipeline.
sonar.issue.ignore.multicriteria=i1,i2,i3
sonar.issue.ignore.multicriteria.i1.ruleKey=*
sonar.issue.ignore.multicriteria.i1.resourceKey=**/*
sonar.issue.ignore.multicriteria.i1.severity=INFO

sonar.issue.ignore.multicriteria.i2.ruleKey=*
sonar.issue.ignore.multicriteria.i2.resourceKey=**/*
sonar.issue.ignore.multicriteria.i2.severity=MINOR

sonar.issue.ignore.multicriteria.i3.ruleKey=*
sonar.issue.ignore.multicriteria.i3.resourceKey=**/*
sonar.issue.ignore.multicriteria.i3.severity=MAJOR
